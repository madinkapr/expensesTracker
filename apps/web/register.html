<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />  
    <title data-i18n="register_title">Ro'yxatdan o'tish</title>
</head>
<body class="auth-page">
    
    <div class="auth-container">
        <div class="auth-header">
            <h2 data-i18n="register_header">Ro'yxatdan o'tish 🚀</h2>
            <p data-i18n="register_subheader">O'z xarajatlaringizni boshqarishni hoziroq boshlang</p>
        </div>

        <form id="register-form">
            <div class="form-group">
                <label for="name" data-i18n="label_full_name">To'liq ismingiz</label>
                <input type="text" id="name" placeholder="Masalan: Ali Valiyev" required autocomplete="name" data-i18n="placeholder_full_name">
            </div>

            <div class="form-group">
                <label for="email" data-i18n="label_email">Email manzil</label>
                <input type="email" id="email" placeholder="Sizning emailingiz..." required autocomplete="email" data-i18n="placeholder_email">
            </div>

            <div class="form-group">
                <label for="password" data-i18n="label_password">Parol</label>
                <input type="password" id="password" placeholder="Kamida 6 ta belgi..." required autocomplete="new-password" data-i18n="placeholder_new_password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;" data-i18n="btn_register">Ro'yxatdan o'tish</button>
        </form>

        <div class="auth-footer">
            <p><span data-i18n="have_account">Allaqachon hisobingiz bormi?</span> <a href="/login.html" data-i18n="link_login">Kirish</a></p>
        </div>
    </div>

    <script src="/src/js/main.js" type="module"></script>
</body>
</html>
