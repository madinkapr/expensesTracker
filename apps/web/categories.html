<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="categories_web_title">Kategoriyalar</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body class="dashboard-page">
    <div class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">ExpenseWise</div>
        <nav class="side-nav">
            <a href="/dashboard.html"><span data-i18n="nav_dashboard">📊 Umumiy</span></a>
            <a href="/expenses.html"><span data-i18n="nav_expenses">💸 Xarajatlar</span></a>
            <a href="/categories.html" class="active"><span data-i18n="nav_categories">🏷️ Kategoriyalar</span></a>
            <a href="/reports.html"><span data-i18n="nav_reports">📈 Hisobotlar</span></a>
            <a href="/settings.html"><span data-i18n="nav_settings">⚙️ Sozlamalar</span></a>
        </nav>
        <button id="logout-btn" class="btn-logout" data-i18n="btn_logout">Chiqish</button>
    </aside>

    <main class="main-content">
        <header class="dashboard-header">
            <div class="header-left">
                <button id="menu-toggle" class="btn-menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="welcome">
                    <h1 data-i18n="categories_title">🏷️ Kategoriyalar</h1>
                    <p data-i18n="categories_desc">Xarajat va daromad turlarini boshqaring</p>
                </div>
            </div>
            <div class="user-profile">
                <!-- Custom Til tanlash dropdown -->
                <div class="custom-lang-dropdown" id="lang-dropdown">
                    <div class="lang-trigger">
                        <span class="lang-icon">🌐</span>
                        <span id="selected-lang">UZ</span>
                        <span class="lang-arrow"></span>
                    </div>
                    <ul class="lang-options">
                        <li data-value="uz">UZ</li>
                        <li data-value="ru">RU</li>
                        <li data-value="en">EN</li>
                    </ul>
                </div>

                <button id="theme-toggle" class="btn-theme"></button>
                <button id="add-category-btn" class="btn btn-primary" data-i18n="btn_new_category">+ Yangi kategoriya</button>
                <a href="/settings.html" title="Sozlamalar">
                    <div class="avatar">👤</div>
                </a>
            </div>
        </header>

        <div class="categories-container">
            <div id="categories-grid" class="categories-grid">
                <!-- Kategoriyalar JS orqali yuklanadi -->
                <div class="loading" data-i18n="loading">Yuklanmoqda...</div>
            </div>
        </div>
    </main>

    <!-- Kategoriya qo'shish modali -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="modal_new_category">Yangi kategoriya</h2>
                <span class="close-modal">&times;</span>
            </div>
            <form id="category-form">
                <div class="form-group">
                    <label for="cat-name" data-i18n="label_category_name">Kategoriya nomi</label>
                    <input type="text" id="cat-name" placeholder="Masalan: Svet to'lovi" required data-i18n="placeholder_category_name">
                </div>
                <div class="form-group">
                    <label for="cat-icon" data-i18n="label_category_icon">Ikonka (Emoji)</label>
                    <input type="text" id="cat-icon" placeholder="Masalan: ⚡" required data-i18n="placeholder_category_icon">
                </div>
                <div class="form-group">
                    <label for="cat-type" data-i18n="label_category_type">Turi</label>
                    <select id="cat-type">
                        <option value="expense" data-i18n="type_expense">Xarajat 💸</option>
                        <option value="income" data-i18n="type_income">Daromad 💰</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cat-parent-name" data-i18n="label_parent_category">Asosiy kategoriya nomi (Sub-kategoriya bo'lsa yozing)</label>
                    <input type="text" id="cat-parent-name" list="main-cats-list" placeholder="Masalan: Kommunal" data-i18n="placeholder_parent_category">
                    <datalist id="main-cats-list">
                        <!-- Mavjud asosiy kategoriyalar bu yerga chiqadi -->
                    </datalist>
                    <small style="font-size: 11px; color: var(--text-muted);" data-i18n="parent_category_hint">Bo'sh qoldirsangiz, bu yangi asosiy kategoriya bo'ladi.</small>
                </div>
                <button type="submit" class="btn btn-primary btn-block" data-i18n="btn_save">Saqlash</button>
            </form>
        </div>
    </div>

    <script src="/src/js/main.js" type="module"></script>
    <script src="/src/js/categories.js" type="module"></script>
</body>

</html>
