<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategoriyalar - ExpenseWise</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-page">
    <div class="sidebar-overlay"></div>
    
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">ExpenseWise</div>
        <nav class="side-nav">
            <a href="/dashboard.html">📊 Umumiy</a>
            <a href="/expenses.html">💸 Xarajatlar</a>
            <a href="/categories.html" class="active">🏷️ Kategoriyalar</a>
            <a href="/reports.html">📈 Hisobotlar</a>
            <a href="/settings.html">⚙️ Sozlamalar</a>
        </nav>
        <button id="logout-btn" class="btn-logout">Chiqish</button>
    </aside>

    <main class="main-content">
        <header class="dashboard-header">
            <div class="header-left">
                <button id="menu-toggle" class="btn-menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="welcome">
                    <h1>🏷️ Kategoriyalar</h1>
                    <p>Xarajat va daromad turlarini boshqaring</p>
                </div>
            </div>
            <div class="user-profile">
                <button id="theme-toggle" class="btn-theme"></button>
                <button id="add-category-btn" class="btn btn-primary">+ Yangi kategoriya</button>
                <a href="/settings.html" title="Sozlamalar">
                    <div class="avatar">👤</div>
                </a>
            </div>
        </header>

        <div class="categories-container">
            <div id="categories-grid" class="categories-grid">
                <!-- Kategoriyalar JS orqali yuklanadi -->
                <div class="loading">Yuklanmoqda...</div>
            </div>
        </div>
    </main>

    <!-- Kategoriya qo'shish modali -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Yangi kategoriya</h2>
                <span class="close-modal">&times;</span>
            </div>
            <form id="category-form">
                <div class="form-group">
                    <label for="cat-name">Kategoriya nomi</label>
                    <input type="text" id="cat-name" placeholder="Masalan: Svet to'lovi" required>
                </div>
                <div class="form-group">
                    <label for="cat-icon">Ikonka (Emoji)</label>
                    <input type="text" id="cat-icon" placeholder="Masalan: ⚡" required>
                </div>
                <div class="form-group">
                    <label for="cat-type">Turi</label>
                    <select id="cat-type">
                        <option value="expense">Xarajat 💸</option>
                        <option value="income">Daromad 💰</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cat-parent-name">Asosiy kategoriya nomi (Sub-kategoriya bo'lsa yozing)</label>
                    <input type="text" id="cat-parent-name" list="main-cats-list" placeholder="Masalan: Kommunal">
                    <datalist id="main-cats-list">
                        <!-- Mavjud asosiy kategoriyalar bu yerga chiqadi -->
                    </datalist>
                    <small style="font-size: 11px; color: var(--text-muted);">Bo'sh qoldirsangiz, bu yangi asosiy kategoriya bo'ladi.</small>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Saqlash</button>
            </form>
        </div>
    </div>

    <script src="/src/js/main.js" type="module"></script>
    <script src="/src/js/categories.js" type="module"></script>
</body>
</html>
