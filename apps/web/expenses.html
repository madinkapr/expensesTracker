<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xarajatlar</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-page">
    <div class="sidebar-overlay"></div>
    
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">ExpenseWise</div>
        <nav class="side-nav">
            <a href="/dashboard.html">📊 Umumiy</a>
            <a href="/expenses.html" class="active">💸 Xarajatlar</a>
            <a href="/categories.html">🏷️ Kategoriyalar</a>
            <a href="/reports.html">📈 Hisobotlar</a>
            <a href="/settings.html">⚙️ Sozlamalar</a>
        </nav>
        <button id="logout-btn" class="btn-logout">Chiqish</button>
    </aside>

    <main class="main-content">
        <header class="dashboard-header">
            <div class="header-left">
                <button id="menu-toggle" class="btn-menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="welcome">
                    <h1>Barcha xarajatlar</h1>
                    <p>Xarajatlaringizni batafsil ko'ring va tahlil qiling</p>
                </div>
            </div>
            <div class="user-profile">
                <button id="theme-toggle" class="btn-theme"></button>
                <a href="/settings.html" title="Sozlamalar">
                    <div class="avatar">👤</div>
                </a>
            </div>
        </header>

        <!-- FILTRLAR BO'LIMI -->
        <section class="filters-section card">
            <div class="filter-grid">
                <div class="filter-group">
                    <label>Kategoriya</label>
                    <select id="filter-category">
                        <option value="all">Barchasi</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Sana (dan)</label>
                    <input type="date" id="filter-date-from">
                </div>
                <div class="filter-group">
                    <label>Sana (gacha)</label>
                    <input type="date" id="filter-date-to">
                </div>
                <div class="filter-actions">
                    <button id="apply-filters" class="btn btn-primary">Saralash</button>
                    <button id="reset-filters" class="btn btn-outline">Tozalash</button>
                </div>
            </div>
        </section>

        <!-- XARAJATLAR JADVALI -->
        <section class="transactions-table-container card">
            <div class="table-responsive">
                <table class="transactions-table">
                    <thead>
                        <tr>
                            <th>Sana</th>
                            <th>Kategoriya</th>
                            <th>Izoh</th>
                            <th>Miqdor</th>
                            <th>Amallar</th>
                        </tr>
                    </thead>
                    <tbody id="expenses-tbody">
                        <!-- Ma'lumotlar JS orqali keladi -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/src/main.js" type="module"></script>
    <script src="/src/expenses.js" type="module"></script>
</body>
</html>
