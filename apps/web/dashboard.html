<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ExpenseWise</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="dashboard-page">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">ExpenseWise</div>
        <nav class="side-nav">
            <a href="/dashboard.html" class="active">📊 Umumiy</a>
            <a href="#">💸 Xarajatlar</a>
            <a href="#">📈 Hisobotlar</a>
            <a href="#">⚙️ Sozlamalar</a>
        </nav>
        <button id="logout-btn" class="btn-logout">Chiqish</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="dashboard-header">
            <div class="welcome">
                <h1 id="user-welcome">Xush kelibsiz!</h1>
                <p>Bugungi moliyaviy holatingiz</p>
            </div>
            <div class="user-profile">
                <button id="add-expense-btn" class="btn btn-primary">+ Yangi xarajat</button>
                <button id="theme-toggle" class="btn-theme"></button>
                <div class="avatar">👤</div>
            </div>
        </header>

        <!-- MODAL: Yangi xarajat qo'shish -->
        <div id="expense-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Yangi xarajat</h2>
                    <span class="close-modal">&times;</span>
                </div>
                <form id="expense-form">
                    <div class="form-group">
                        <label for="amount">Miqdori (UZS)</label>
                        <input type="number" id="amount" placeholder="Masalan: 50000" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Kategoriya</label>
                        <select id="category" required>
                            <option value="">Tanlang...</option>
                            <option value="ovqat">Ovqat</option>
                            <option value="transport">Transport</option>
                            <option value="ko'ngilochar">Ko'ngilochar</option>
                            <option value="boshqa">Boshqa</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Izoh</label>
                        <input type="text" id="description" placeholder="Nima uchun ishlatildi?">
                    </div>
                    <div class="form-group">
                        <label for="date">Sana</label>
                        <input type="date" id="date" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Saqlash</button>
                </form>
            </div>
        </div>

        <section class="dashboard-body">
            <div class="card-grid">
                <div class="card card-stat">
                    <h3>Jami xarajat</h3>
                    <p class="stat-value">0 UZS</p>
                </div>
                <div class="card card-stat">
                    <h3>Joriy oy</h3>
                    <p class="stat-value">0 UZS</p>
                </div>
                <div class="card card-stat">
                    <h3>Qolgan limit</h3>
                    <p class="stat-value">0 UZS</p>
                </div>
            </div>

            <!-- Grafik bo'limi -->
            <div class="card chart-card" style="margin-bottom: 30px;">
                <h3>Xarajatlar tahlili (Kategoriya bo'yicha)</h3>
                <div style="max-width: 300px; margin: 0 auto;">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>


            <!-- Bu yerga keyinroq xarajatlar ro'yxatini qo'shamiz -->
            <div class="card recent-activity">
                <h3>Oxirgi xarajatlar</h3>
                <p style="color: var(--text-muted); margin-top: 10px;">Hozircha hech qanday xarajat kiritilmagan.</p>
            </div>
        </section>
    </main>

    <script src="/src/main.js" type="module"></script>
    <script src="/src/dashboard.js" type="module"></script>
</body>

</html>
