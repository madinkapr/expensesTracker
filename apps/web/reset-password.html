<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title data-i18n="reset_password_title">Yangi parol</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    
    <div class="auth-container">
        <div class="auth-header">
            <h2 data-i18n="reset_header">🔑 Yangi parol o'rnatish</h2>
            <p data-i18n="reset_subheader">Yangi parolingizni kiriting</p>
        </div>

        <div id="step-form">
            <form id="reset-form">
                <div class="form-group">
                    <label for="newPassword" data-i18n="label_new_password">Yangi parol</label>
                    <input type="password" id="newPassword" placeholder="Kamida 6 ta belgi..." required minlength="6" data-i18n="placeholder_new_password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword" data-i18n="label_confirm_password">Parolni tasdiqlang</label>
                    <input type="password" id="confirmPassword" placeholder="Parolni qayta kiriting..." required data-i18n="placeholder_confirm_password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;" data-i18n="btn_update_pass">
                    Parolni yangilash
                </button>
            </form>
        </div>

        <!-- Muvaffaqiyat -->
        <div id="step-success" style="display: none; text-align: center; padding: 20px 0;">
            <div style="font-size: 48px; margin-bottom: 20px;">✅</div>
            <h3 style="color: var(--primary-color); margin-bottom: 10px;" data-i18n="pass_updated_title">Parol yangilandi!</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;" data-i18n="pass_updated_desc">
                Endi yangi parolingiz bilan kirishingiz mumkin.
            </p>
            <a href="/login.html" class="btn btn-primary" data-i18n="btn_login">Tizimga kirish</a>
        </div>

        <!-- Xatolik (token eskirgan) -->
        <div id="step-error" style="display: none; text-align: center; padding: 20px 0;">
            <div style="font-size: 48px; margin-bottom: 20px;">❌</div>
            <h3 style="color: var(--danger); margin-bottom: 10px;" data-i18n="link_expired_title">Havola eskirgan</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;" data-i18n="link_expired_desc">
                Parolni tiklash havolasi 15 daqiqa davomida amal qiladi.
            </p>
            <a href="/forgot-password.html" class="btn btn-outline" data-i18n="btn_request_again">Qaytadan so'rash</a>
        </div>
    </div>

    <script src="/src/js/main.js" type="module"></script>
    <script src="/src/js/reset-password.js" type="module"></script>
</body>
</html>
