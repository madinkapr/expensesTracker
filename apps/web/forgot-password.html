<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Parolni tiklash</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h2>🔐 Parolni tiklash</h2>
            <p>Emailingizni kiriting, parolni tiklash havolasi yuboramiz</p>
        </div>

        <!-- Email yuborish formasi -->
        <div id="step-email">
            <form id="forgot-form">
                <div class="form-group">
                    <label for="email">Email manzilingiz</label>
                    <input type="email" id="email" placeholder="Emailingizni kiriting..." required autocomplete="email">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    Havola yuborish
                </button>
            </form>
            <div class="auth-footer">
                <p><a href="/login.html">← Kirish sahifasiga qaytish</a></p>
            </div>
        </div>

        <!-- Muvaffaqiyat xabari -->
        <div id="step-success" style="display: none; text-align: center; padding: 20px 0;">
            <div style="font-size: 48px; margin-bottom: 20px;">📧</div>
            <h3 style="color: var(--primary-color); margin-bottom: 10px;">Email yuborildi!</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;">
                Emailingizni tekshiring va havolaga bosing.
            </p>
            <a href="/login.html" class="btn btn-outline">Kirish sahifasiga qaytish</a>
        </div>
    </div>

    <script src="/src/js/main.js" type="module"></script>
    <script src="/src/js/forgot-password.js" type="module"></script>
</body>
</html>
