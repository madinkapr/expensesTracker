<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Yangi parol</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h2>🔑 Yangi parol o'rnatish</h2>
            <p>Yangi parolingizni kiriting</p>
        </div>

        <div id="step-form">
            <form id="reset-form">
                <div class="form-group">
                    <label for="newPassword">Yangi parol</label>
                    <input type="password" id="newPassword" placeholder="Kamida 6 ta belgi..." required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Parolni tasdiqlang</label>
                    <input type="password" id="confirmPassword" placeholder="Parolni qayta kiriting..." required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    Parolni yangilash
                </button>
            </form>
        </div>

        <!-- Muvaffaqiyat -->
        <div id="step-success" style="display: none; text-align: center; padding: 20px 0;">
            <div style="font-size: 48px; margin-bottom: 20px;">✅</div>
            <h3 style="color: var(--primary-color); margin-bottom: 10px;">Parol yangilandi!</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;">
                Endi yangi parolingiz bilan kirishingiz mumkin.
            </p>
            <a href="/login.html" class="btn btn-primary">Tizimga kirish</a>
        </div>

        <!-- Xatolik (token eskirgan) -->
        <div id="step-error" style="display: none; text-align: center; padding: 20px 0;">
            <div style="font-size: 48px; margin-bottom: 20px;">❌</div>
            <h3 style="color: var(--danger); margin-bottom: 10px;">Havola eskirgan</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;">
                Parolni tiklash havolasi 15 daqiqa davomida amal qiladi.
            </p>
            <a href="/forgot-password.html" class="btn btn-outline">Qaytadan so'rash</a>
        </div>
    </div>

    <script src="/src/main.js" type="module"></script>
    <script type="module">
        const API_URL = 'http://localhost:3000/api';

        // URL dan tokenni olish
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('step-form').style.display = 'none';
            document.getElementById('step-error').style.display = 'block';
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                alert('Parollar mos kelmadi!');
                return;
            }

            const btn = e.target.querySelector('button');
            btn.textContent = 'Yangilanmoqda...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/auth/reset-password/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newPassword })
                });

                const data = await res.json();

                if (res.ok) {
                    document.getElementById('step-form').style.display = 'none';
                    document.getElementById('step-success').style.display = 'block';
                } else {
                    document.getElementById('step-form').style.display = 'none';
                    document.getElementById('step-error').style.display = 'block';
                }
            } catch (err) {
                alert('Server bilan aloqa yo\'q');
                btn.textContent = 'Parolni yangilash';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
